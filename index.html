*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
body{background:#0f0a1a;color:white;overflow-x:hidden}
header{background:radial-gradient(circle at 50% 0%,#3b0a5e,#150826 70%);text-align:center;padding:60px 20px 80px;position:relative;overflow:hidden}
header h1{font-size:42px;background:linear-gradient(90deg,#ff2e88,#a855f7,#00e5ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:glow 2s infinite alternate}

@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.07)}100%{transform:scale(1)}}
.section{padding:45px 20px;max-width:900px;margin:auto}
h2{text-align:center;font-size:28px;margin-bottom:25px}
h2 span{color:#ff2e88}
