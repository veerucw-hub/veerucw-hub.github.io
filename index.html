body{background:#EAF6FF;color:#2a3a4a;overflow-x:hidden}
header{background:linear-gradient(135deg,#AEDFF7,#7EC8E3,#D6F0FF);text-align:center;padding:60px 20px 80px;position:relative;overflow:hidden}

header p{color:#3a6a85;margin:10px 0;font-weight:600}
.btn{display:inline-block;background:#4AB3E0;color:white;padding:16px 32px;border-radius:50px;font-weight:900;font-size:18px;text-decoration:none;margin-top:18px;box-shadow:0 10px 25px rgba(74,179,224,.4);animation:pulse 1.8s infinite}

.card.show{opacity:1;transform:translateY(0)}
.card img{width:100%;height:280px;object-fit:cover;transition:.6s}
.card:hover img{transform:scale(1.08)}
.card-body{padding:22px;text-align:center}
.price{font-size:26px;color:#1a9ad6;font-weight:900;margin:10px 0}
.order{background:#4AB3E0;color:white;padding:12px 26px;border-radius:30px;text-decoration:none;display:inline-block;font-weight:800}
.badge{background:#AEDFF7;color:#1a5a7a;padding:6px 14px;border-radius:20px;font-size:12px;font-weight:800}
.before-after{display:flex;gap:10px;margin:15px 0}
.before-after div{flex:1;text-align:center}
